name: Stats
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write 
  
jobs:
  stats:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Prepare branch
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          git fetch origin stats || true
          git checkout stats || git checkout --orphan stats && git reset
        
      - name: Run stats.py
        run: python .github/workflows/stats.py > stats.txt

      - name: Result commit
        run: |
          mkdir -p history
          cp stats.txt "history/$(date -u +'%Y-%m-%dT%H-%M-%SZ').txt"

          git add stats.txt history/
          git commit -m "Update stats ($(date -u +'%Y-%m-%d %H:%M:%S'))" || echo "No changes"
          git push origin stats
